name: Build LaneTheory

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-msvc

      - name: Run focused tests
        shell: pwsh
        run: cargo test --release --bin lanetheory

      - name: Build release binary
        shell: pwsh
        run: cargo build --release --bin lanetheory

      - name: Build validated offline data pack
        shell: pwsh
        run: target/release/lanetheory.exe --refresh-data-pack

      - name: Prepare portable artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/lanetheory.exe dist/LaneTheory.exe
          Copy-Item target/release/LaneTheory.ypk dist/LaneTheory.ypk
          Copy-Item run.bat dist/run.bat
          Copy-Item README.md dist/README.md

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaneTheory-windows-x64
          path: dist/
          if-no-files-found: error
